# Two entries: the Host tool (index.js through ctx.tools) and an MCP client
# pointing at the stdio server in lib/mcp_server.py. They share one
# pipeline; the tool is the convenient path, the MCP server is what any other
# MCP client can attach to.
#
# No absolute path is baked in. The launcher below finds the everything2chart
# checkout (the directory holding src/everything2chart/cli.py) by trying, in order:
# E2C_REPO (or the older PIANOCHART_REPO), $HOME/everything2chart,
# $HOME/piano-rescue, $HOME/piano, then walking up from the working directory.
# E2C_PYTHON / E2C_MCP override the two files. A checkout anywhere else only
# needs E2C_REPO set.
- insert:
    - id: dsh-pianochart
      name: dsh-pianochart
    - id: dsh-pianochart-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dsh-pianochart
        transport: stdio
        # A score needs minutes of CPU; the client default of 60 s would cut
        # every real run off mid-pipeline. Match the Host tool's budget.
        toolCallTimeoutMs: 1800000
        command: /bin/sh
        args:
          - -c
          - |
            E2C_REPO=${E2C_REPO:-${PIANOCHART_REPO:-}}
            E2C_MCP=${E2C_MCP:-${PIANOCHART_MCP:-}}
            E2C_PYTHON=${E2C_PYTHON:-${PIANOCHART_PYTHON:-}}
            repo=
            for c in "$E2C_REPO" "$HOME/everything2chart" "$HOME/piano-rescue" "$HOME/piano" "$PWD"; do
              d=${c:-$PWD}
              while :; do
                if [ -f "$d/src/everything2chart/cli.py" ]; then repo=$d; break 2; fi
                p=$(dirname "$d")
                [ "$p" = "$d" ] && break
                d=$p
              done
            done
            if [ -z "$repo" ]; then
              echo "everything2chart: no checkout found; set E2C_REPO to the directory containing src/everything2chart/cli.py" >&2
              exit 1
            fi
            mcp=$E2C_MCP
            [ -n "$mcp" ] || mcp=$repo/dsh-bundle/lib/mcp_server.py
            py=$E2C_PYTHON
            [ -n "$py" ] || { [ -x "$repo/.venv/bin/python" ] && py=$repo/.venv/bin/python; }
            [ -n "$py" ] || py=$(command -v python3)
            exec "$py" "$mcp"
        failOnStartupError: false
